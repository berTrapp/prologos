<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Prólogos</title>
    <meta
      name="description"
      content="Planeje um projeto de software antes de codar: stack, ambiente, dados e o que falta decidir, num mapa."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the theme before first paint so the page opens ready (ux-ui 6).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('prologos.theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
